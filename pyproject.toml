[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dnd-master"
version = "0.1.0"
description = "Deterministic D&D rule engine with an AI Dungeon Master layer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dnd_engine.resources" = [
    "rulesets/dnd_5e/5.1/definitions/*.json",
    "rulesets/dnd_5e/5.1/NOTICE.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src/dnd_engine"]
show_error_codes = true
warn_unused_configs = true
